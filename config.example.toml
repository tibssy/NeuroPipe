version = 1

[ipc]
stt_cmd = "ipc:///tmp/neuropipe_cmd.sock"
stt_pub = "ipc:///tmp/neuropipe_pub.sock"
tts_cmd = "ipc:///tmp/neuropipe_tts_cmd.sock"
tts_events = "ipc:///tmp/neuropipe_tts_events.sock"
assistant_cmd = "ipc:///tmp/neuropipe_assistant_cmd.sock"

[stt]
mode = "IDLE"
model = "nemo-parakeet-tdt-0.6b-v3"
vad_threshold = 0.5
# Consecutive VAD-above-threshold frames required to start a recording and emit
# listening_start (debounces transient noise; 5 frames ≈ 160 ms).
vad_start_frames = 5
digital_gain = 3.0
silence_timeout_sec = 1.0
model_idle_timeout_sec = 60
# Smart turn-end detection: a small detector scores pauses and ends the turn
# as soon as the speaker is likely done, instead of a fixed silence timeout.
# silence_timeout_sec above is kept as the fallback when turn_end_enabled=false.
turn_end_enabled = true
turn_hold_ms = 900
turn_end_threshold = 0.5
turn_score_cadence_ms = 500
turn_hard_ceiling_ms = 3500
# Turn-end detector backend: "smart_turn" (ONNX classifier, default) or
# "heuristic" (prosodic scorer). If the smart-turn model is missing, the
# service logs a warning once and falls back to "heuristic".
turn_detector = "smart_turn"
# Path to the smart-turn ONNX model (stored alongside the VAD model).
smart_turn_model_path = "~/.local/share/neuropipe/stt/smart_turn_v3.2_cpu.onnx"
# Shortest utterance (ms) the smart-turn model treats as a possible complete
# turn; shorter recordings keep recording instead of being scored.
smart_turn_min_utterance_ms = 1200

[tts.defaults]
engine = "kokoro"
voice = "af_bella"
speed = 1.0
quality = "high"
idle_timeout_sec = 60

[tts.speeds]
# Optional per-engine speed overrides. Unlisted engines use tts.defaults.speed.
kokoro = 1.0
pocket-tts = 1.0
supertonic-3 = 1.0

[tts.favorites]
# Used by: neuro-ipc tts set-state --voice next|prev
# Empty list means cycle all available voices.
kokoro = []
pocket_tts = []
supertonic_3 = []

[assistant]
default_model = "llama3.2:1b"
history_idle_timeout_sec = 3600

# Duck (lower) media playback volume while the user is speaking, so the
# assistant can hear the user over a playing video or song.
duck_media = true
duck_volume = 0.1

[assistant.favorites]
# Used by: neuro-ipc assistant set-model next|prev
# Empty list means cycle all available models.
models = []

[assistant.memory]
# Privacy gate based on model type:
# - local models: controlled by enabled_local
# - cloud models (suffix :cloud): controlled by enabled_cloud
# If disabled for the active model type, the assistant will not read from
# or write to long-term memory.
enabled_local = true
enabled_cloud = false
summarize_on_idle = true
summarize_on_stop = true
max_summary_chars = 1200
retrieve_top_k = 4
qdrant_path = "~/.local/share/neuropipe/memory/qdrant"
collection = "assistant_memory"
embedding_model = "all-minilm"

[assistant.instructions]
system_prompt = """
You are a helpful AI voice assistant.
Keep answers short and conversational.
This is a voice-to-voice conversation: assume the user replies by speaking, not typing.
If you need confirmation (for example before using a tool in ask mode), request a spoken yes/no response and never ask the user to type.
/set nothink
"""
tool_usage_policy = """
When the user asks about something a tool can help with,
call the appropriate tool automatically.
If a tool is in ask mode, request spoken permission (yes/no)
and continue based on the user's voice response.
Do not ask the user to type permission commands.
"""

[assistant.tools]
open_url = "ask"
screenshot = "ask"
web_search = "ask"
media_control = "allow"
