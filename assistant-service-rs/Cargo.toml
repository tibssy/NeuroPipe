[package]
name = "neuro-assistant-service"
version = "0.1.0"
edition = "2021"
description = "NeuroPipe Assistant Service - STT -> Ollama -> TTS voice assistant daemon"

[[bin]]
name = "neuro-assistant-service"
path = "src/main.rs"

[dependencies]
zmq = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
fancy-regex = "0.14"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
once_cell = "1.21.4"

[profile.release]
lto = true
strip = true
opt-level = 3
