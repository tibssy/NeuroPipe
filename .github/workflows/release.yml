name: Release NeuroPipe

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev

      - name: Build TTS service
        working-directory: tts-service-rs
        run: cargo build --release

      - name: Build STT service
        working-directory: stt-service-rs
        run: cargo build --release

      - name: Build Assistant service
        working-directory: assistant-service-rs
        run: cargo build --release

      - name: Build CLI
        run: cargo build --release --manifest-path cli/Cargo.toml

      - name: Rename binaries with architecture suffix
        run: |
          cp tts-service-rs/target/release/neuro-tts-service tts-service-rs/target/release/neuro-tts-service-linux-${{ matrix.arch }}
          cp stt-service-rs/target/release/neuro-stt-service stt-service-rs/target/release/neuro-stt-service-linux-${{ matrix.arch }}
          cp assistant-service-rs/target/release/neuro-assistant-service assistant-service-rs/target/release/neuro-assistant-service-linux-${{ matrix.arch }}
          cp cli/target/release/neuro-ipc cli/target/release/neuro-ipc-linux-${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neuropipe-linux-${{ matrix.arch }}
          path: |
            tts-service-rs/target/release/neuro-tts-service-linux-${{ matrix.arch }}
            stt-service-rs/target/release/neuro-stt-service-linux-${{ matrix.arch }}
            assistant-service-rs/target/release/neuro-assistant-service-linux-${{ matrix.arch }}
            cli/target/release/neuro-ipc-linux-${{ matrix.arch }}

  publish-release:
    needs: build-linux
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: neuropipe-linux-*
          merge-multiple: true

      - name: Publish release with changelog
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/**
