name: Release NeuroPipe

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y patchelf espeak-ng libzmq3-dev

      - name: Build TTS service
        working-directory: tts-service
        run: chmod +x build.sh && ./build.sh

      - name: Build STT service
        working-directory: stt-service
        run: chmod +x build.sh && ./build.sh

      - name: Build Assistant service
        working-directory: assistant-service
        run: chmod +x build.sh && ./build.sh

      - name: Build CLI
        run: cargo build --release --manifest-path cli/Cargo.toml

      - name: Rename binaries with architecture suffix
        run: |
          cp tts-service/dist/neuro-tts-service tts-service/dist/neuro-tts-service-linux-${{ matrix.arch }}
          cp stt-service/dist/neuro-stt-service stt-service/dist/neuro-stt-service-linux-${{ matrix.arch }}
          cp assistant-service/dist/neuro-assistant-service assistant-service/dist/neuro-assistant-service-linux-${{ matrix.arch }}
          cp cli/target/release/neuro-ipc cli/target/release/neuro-ipc-linux-${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neuropipe-linux-${{ matrix.arch }}
          path: |
            tts-service/dist/neuro-tts-service-linux-${{ matrix.arch }}
            stt-service/dist/neuro-stt-service-linux-${{ matrix.arch }}
            assistant-service/dist/neuro-assistant-service-linux-${{ matrix.arch }}
            cli/target/release/neuro-ipc-linux-${{ matrix.arch }}

  publish-release:
    needs: build-linux
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: neuropipe-linux-*
          merge-multiple: true

      - name: Publish release with changelog
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**
