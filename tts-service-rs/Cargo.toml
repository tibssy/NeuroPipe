[package]
name = "neuro-tts-service"
version = "0.1.0"
edition = "2021"
description = "NeuroPipe TTS service with native Kokoro inference"

[[bin]]
name = "neuro-tts-service"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
espeak-ng = { version = "0.1.3", features = ["bundled-data-en"] }
ndarray = "0.16"
ndarray-npy = { version = "0.9", features = ["npz"] }
ort = { version = "2.0.0-rc.13", features = ["ndarray"] }
rand = "0.9"
rand_distr = "0.5"
rodio = "0.21"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentencepiece-model = "0.1.4"
toml = "0.8"
unicode-normalization = "0.1"
whatlang = "0.18"
zmq = "0.10"

[profile.release]
lto = true
strip = true
opt-level = 3
